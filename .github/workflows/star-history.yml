name: Update star history chart

on:
  schedule:
    - cron: "0 3 */7 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  update-chart:
    if: github.repository == 'TingsongYu/PyTorch-Tutorial-2nd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install matplotlib and numpy
        run: pip install matplotlib numpy

      - name: Generate star history chart
        run: python scripts/gen_star_history.py --refresh
        env:
          GITHUB_TOKEN: ${{ secrets.STAR_HISTORY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit updated charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset/star-history.png
          git diff --cached --quiet && exit 0
          git commit -m "Update star history chart [skip ci]"
          git push
